<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bloc réécrit page par page au build par scripts/seo-build.mjs. Les
         valeurs ci-dessous sont celles de « / », pour que le développement
         local voie exactement ce que voit la page d'accueil en production.
         Ne rien ajouter entre les marqueurs à la main : tout y est écrasé. -->
    <!--SEO:START-->
    <title>Tessitura — solfège et pratique musicale pour jeunes élèves</title>
    <meta name="description" content="Application gratuite d’exercices de rythme, de théorie musicale, de lecture de notes, d’harmonie et d’accordage pour les élèves de conservatoire et d’école de musique, du cycle 1 au cycle 3." />
    <!--SEO:END-->
    <meta name="theme-color" content="#4A6CF7" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tessitura" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/righteous-latin-400.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-var.woff2" crossorigin>
    <style>
      /* Polices auto-hébergées (SIL Open Font License — voir /fonts/OFL-*.txt).
         Elles étaient servies par le CDN de polices de Google, ce qui adressait
         l'IP de chaque élève à ce tiers à chaque démarrage, en render-blocking.
         Les @font-face sont ici, et non dans index.css, parce que l'écran de
         démarrage #boot doit disposer de Righteous AVANT que React ne charge.

         Sous-ensemble `latin` seul : il couvre Œ/œ (U+0152-0153) et
         l'apostrophe typographique (U+2019), donc tout le français. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 900;  /* fichier variable : une seule requête pour toutes les graisses */
        font-display: swap;
        src: url('/fonts/inter-latin-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Righteous';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/righteous-latin-400.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Écran de démarrage — inline et sans JS, pour peindre AVANT que React ne
         démarre. Le premier rendu remplace le contenu de #root, ce qui le fait
         disparaître tout seul : aucun code de nettoyage nécessaire.
         Les couleurs sont en dur car ThemeProvider n'a pas encore pu s'exécuter ;
         on suit donc la préférence système. */
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: #f9fafb;
      }
      #boot-notes { display: flex; gap: 9px; }
      #boot-notes i {
        width: 11px; height: 11px; border-radius: 50%;
        background: #4A6CF7; display: block;
        animation: boot-pulse 1.15s ease-in-out infinite;
      }
      #boot-notes i:nth-child(2) { animation-delay: 0.16s; }
      #boot-notes i:nth-child(3) { animation-delay: 0.32s; }
      #boot-notes i:nth-child(4) { animation-delay: 0.48s; }
      #boot-titre {
        font-family: 'Righteous', 'Inter', system-ui, sans-serif;
        font-size: 27px; letter-spacing: 1.5px; color: #4A6CF7;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: translateY(0)     scale(0.85); opacity: 0.35; }
        50%      { transform: translateY(-11px) scale(1);    opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        #boot { background: #030712; }
      }
      /* Un démarrage lent ne doit pas imposer une animation à qui n'en veut pas. */
      @media (prefers-reduced-motion: reduce) {
        #boot-notes i { animation: none; opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div id="boot-notes"><i></i><i></i><i></i><i></i></div>
        <div id="boot-titre">Tessitura</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(() => {
            // Demande au service worker de précacher TOUS les chunks du build.
            // À chaque visite : sw.js ne changeant pas d'un déploiement à
            // l'autre, son `install` ne se rejouerait pas et les nouveaux
            // chunks ne seraient jamais mis en cache. Sans ça, un module jamais
            // ouvert en ligne échoue en mode avion.
            navigator.serviceWorker.ready.then((reg) => {
              reg.active && reg.active.postMessage({ type: 'PRECACHE' });
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
