<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icone.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tessitura</title>
    <meta name="description" content="Apprends la musique. Progresse à ton rythme." />
    <meta name="theme-color" content="#4A6CF7" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tessitura" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Écran de démarrage — inline et sans JS, pour peindre AVANT que React ne
         démarre. Le premier rendu remplace le contenu de #root, ce qui le fait
         disparaître tout seul : aucun code de nettoyage nécessaire.
         Les couleurs sont en dur car ThemeProvider n'a pas encore pu s'exécuter ;
         on suit donc la préférence système. */
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: #f9fafb;
      }
      #boot-notes { display: flex; gap: 9px; }
      #boot-notes i {
        width: 11px; height: 11px; border-radius: 50%;
        background: #4A6CF7; display: block;
        animation: boot-pulse 1.15s ease-in-out infinite;
      }
      #boot-notes i:nth-child(2) { animation-delay: 0.16s; }
      #boot-notes i:nth-child(3) { animation-delay: 0.32s; }
      #boot-notes i:nth-child(4) { animation-delay: 0.48s; }
      #boot-titre {
        font-family: 'Righteous', 'Inter', system-ui, sans-serif;
        font-size: 27px; letter-spacing: 1.5px; color: #4A6CF7;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: translateY(0)     scale(0.85); opacity: 0.35; }
        50%      { transform: translateY(-11px) scale(1);    opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        #boot { background: #030712; }
      }
      /* Un démarrage lent ne doit pas imposer une animation à qui n'en veut pas. */
      @media (prefers-reduced-motion: reduce) {
        #boot-notes i { animation: none; opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div id="boot-notes"><i></i><i></i><i></i><i></i></div>
        <div id="boot-titre">Tessitura</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(() => {
            // Demande au service worker de précacher TOUS les chunks du build.
            // À chaque visite : sw.js ne changeant pas d'un déploiement à
            // l'autre, son `install` ne se rejouerait pas et les nouveaux
            // chunks ne seraient jamais mis en cache. Sans ça, un module jamais
            // ouvert en ligne échoue en mode avion.
            navigator.serviceWorker.ready.then((reg) => {
              reg.active && reg.active.postMessage({ type: 'PRECACHE' });
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
